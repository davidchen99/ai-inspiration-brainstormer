<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公众号标题与简介发散工具</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --panel: #fffdf8;
      --ink: #1f2428;
      --muted: #66707a;
      --line: #d9d4c8;
      --accent: #276b5d;
      --accent-2: #b5472d;
      --soft: #e8efe9;
      --warn: #fff2d8;
      --shadow: 0 12px 32px rgba(32, 32, 32, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button, input, textarea, select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 430px) 1fr;
    }

    aside {
      padding: 28px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
      max-height: 100vh;
    }

    main {
      padding: 28px;
      overflow: auto;
      max-height: 100vh;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin: 0 0 16px;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-size: 13px;
      color: #3f474f;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(39, 107, 93, .12);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .compact-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      margin: 18px 0 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f1eee6;
    }

    .mode-tab {
      min-height: 38px;
      border-color: transparent;
      background: transparent;
      font-weight: 700;
    }

    .mode-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 8px 16px rgba(39, 107, 93, .14);
    }

    .mode-panel {
      display: none;
    }

    .mode-panel.active {
      display: block;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: #fff;
      color: #34404a;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .chip input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
    }

    .chip button {
      min-height: 0;
      padding: 0;
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      color: #7d4b40;
      background: #f5e3de;
      line-height: 1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      min-height: 40px;
      padding: 9px 13px;
      cursor: pointer;
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 700;
    }

    button.danger {
      color: var(--accent-2);
      border-color: rgba(181, 71, 45, .35);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .status strong { color: var(--accent-2); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .prompt-box, .empty, .api-note {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .api-note {
      margin-bottom: 18px;
      padding: 13px 14px;
      color: #4a4f39;
      background: var(--warn);
      box-shadow: none;
      line-height: 1.6;
      font-size: 13px;
    }

    .prompt-box {
      display: none;
      margin-bottom: 18px;
      padding: 14px;
    }

    .prompt-box textarea {
      min-height: 220px;
      border-color: #c8d4ce;
      background: #fbfffc;
      font-size: 13px;
    }

    .result-list {
      display: grid;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .card.selected {
      border-color: rgba(39, 107, 93, .65);
      background: #fbfffc;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .select-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #34404a;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .select-wrap input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--accent);
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .tag {
      border-radius: 999px;
      background: var(--soft);
      color: #2d5d51;
      padding: 4px 8px;
      font-size: 12px;
    }

    .score {
      color: var(--accent-2);
      font-weight: 700;
      font-size: 13px;
    }

    .title {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.42;
      font-weight: 800;
    }

    .desc {
      margin: 0 0 10px;
      color: #39434b;
      line-height: 1.65;
    }

    .reason {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .meta {
      margin: 9px 0 0;
      display: grid;
      gap: 5px;
      color: #51606b;
      font-size: 13px;
      line-height: 1.55;
    }

    .meta strong {
      color: #34404a;
    }

    .category-edit {
      margin: 10px 0 8px;
      display: grid;
      grid-template-columns: minmax(120px, 220px) 1fr;
      gap: 8px;
      align-items: center;
    }

    .category-edit label {
      margin: 0;
    }

    .card-foot {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .selection-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .selection-bar.active {
      display: flex;
    }

    .selection-count {
      color: var(--muted);
      font-size: 13px;
    }

    .selection-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .empty {
      padding: 34px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .split {
      height: 1px;
      background: var(--line);
      margin: 20px 0;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside, main {
        max-height: none;
        padding: 20px;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .topbar {
        display: block;
      }

      .actions {
        justify-content: flex-start;
        margin-top: 12px;
      }

      .selection-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .selection-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .compact-row, .category-edit {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .toolbar, .actions, .selection-actions {
        display: grid;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>公众号标题与简介发散</h1>
      <p class="sub">灵感不清楚时先发散选题；方向明确后再精修标题。没有 API Key 时也可以先生成提示词。</p>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="idea" type="button">灵感发散</button>
        <button class="mode-tab" data-mode="title" type="button">精修标题</button>
      </div>

      <div class="field">
        <label for="apiKey">DeepSeek API Key <span class="hint">只保存在当前页面内存</span></label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="model">模型</label>
          <select id="model">
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="deepseek-reasoner">deepseek-reasoner</option>
          </select>
        </div>
        <div class="field">
          <label for="count">生成数量</label>
          <select id="count">
            <option>10</option>
            <option selected>15</option>
            <option>20</option>
          </select>
        </div>
      </div>

      <div class="split"></div>

      <section class="mode-panel active" id="ideaPanel">
        <div class="field">
          <label for="fuzzyIdea">模糊想法/一句话灵感</label>
          <textarea id="fuzzyIdea" placeholder="例如：小红书上很多人焦虑副业；AI 工具太多反而不会用了；普通人怎么开始做公众号。"></textarea>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="ideaPlatform">偏向平台</label>
            <select id="ideaPlatform">
              <option selected>公众号</option>
              <option>小红书转公众号</option>
              <option>公众号和小红书都可用</option>
            </select>
          </div>
          <div class="field">
            <label for="ideaCount">发散数量</label>
            <select id="ideaCount">
              <option>5</option>
              <option selected>8</option>
              <option>10</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="ideaDirection">账号方向/可选背景 <span class="hint">可不填</span></label>
          <input id="ideaDirection" placeholder="例如：AI 自媒体、职场成长、普通人副业、工具实战">
        </div>

        <div class="field">
          <label for="ideaAvoid">不想写什么 <span class="hint">可不填</span></label>
          <textarea id="ideaAvoid" placeholder="例如：不要鸡汤；不要太标题党；不要做课程售卖口吻；不要太泛。"></textarea>
        </div>
      </section>

      <section class="mode-panel" id="titlePanel">
        <div class="field">
          <label for="topic">文章主题</label>
          <input id="topic" placeholder="例如：普通人如何用 AI 做公众号日更">
        </div>

        <div class="field">
          <label for="audience">目标读者</label>
          <input id="audience" placeholder="例如：自媒体新手、AI 工具用户、职场人">
        </div>

        <div class="field">
          <label for="positioning">账号定位/人设</label>
          <input id="positioning" placeholder="例如：实战、克制、讲人话、能落地">
        </div>

        <div class="field">
          <label for="point">核心观点</label>
          <textarea id="point" placeholder="这篇文章最想让读者记住什么？"></textarea>
        </div>

        <div class="field">
          <label for="material">参考素材/小红书内容</label>
          <textarea id="material" placeholder="粘贴小红书笔记、评论区痛点、竞品标题、文章草稿或灵感片段。"></textarea>
        </div>

        <div class="field">
          <label>标题风格</label>
          <div class="chips" id="styleChips"></div>
        </div>

        <div class="field">
          <label for="extra">额外要求</label>
          <textarea id="extra" placeholder="例如：不要标题党；标题不超过 24 字；适合公众号推送；更像小红书但别太浮夸。"></textarea>
        </div>
      </section>

      <div class="split"></div>

      <section>
        <div class="field">
          <label>分类库 <span class="hint">AI 生成时会从这里选择</span></label>
          <div class="chips" id="categoryChips"></div>
        </div>
        <div class="compact-row">
          <div class="field">
            <label for="newCategory">新增分类</label>
            <input id="newCategory" placeholder="例如：宠物、养猫经验、AI 工具">
          </div>
          <button id="addCategoryBtn" type="button">添加</button>
        </div>
        <div class="toolbar">
          <button id="resetCategoriesBtn" type="button">重置分类</button>
        </div>
      </section>

      <div class="split"></div>

      <section>
        <div class="field">
          <label for="baseUrl">飞书 Base 链接 <span class="hint">保存到本地</span></label>
          <input id="baseUrl" placeholder="粘贴已有飞书多维表格链接">
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="baseTableName">表名</label>
            <input id="baseTableName" value="公众号选题库">
          </div>
          <div class="field">
            <label for="defaultStatus">默认状态</label>
            <input id="defaultStatus" value="待筛选">
          </div>
        </div>
        <div class="toolbar">
          <button id="saveLarkConfigBtn" type="button">保存飞书配置</button>
          <button id="syncCsvBtn" type="button">下载已选同步 CSV</button>
        </div>
      </section>

      <div class="toolbar">
        <button class="primary" id="generateBtn">调用 DeepSeek</button>
        <button id="promptBtn">生成提示词</button>
        <button id="sampleBtn">填入示例</button>
        <button class="danger" id="clearBtn">清空</button>
      </div>
      <div class="status" id="status"></div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h1>候选结果</h1>
          <p class="sub" id="resultSub">灵感模式字段：分类、选题、推荐标题、简介、目标读者、切入角度、推荐指数、理由。</p>
        </div>
        <div class="actions">
          <button id="copyAllBtn">复制全部</button>
          <button id="copyTsvBtn">复制表格</button>
          <button id="csvBtn">下载 CSV</button>
        </div>
      </div>

      <div class="api-note">
        浏览器直连 DeepSeek 可能受网络或跨域策略影响；如果失败，页面会保留完整提示词，复制到 DeepSeek 或 ChatGPT 也能得到同样结构的结果。
      </div>

      <div class="prompt-box" id="promptBox">
        <label for="promptText">可复制提示词</label>
        <textarea id="promptText" readonly></textarea>
        <div class="toolbar">
          <button id="copyPromptBtn">复制提示词</button>
        </div>
      </div>

      <div class="selection-bar" id="selectionBar">
        <div class="selection-count" id="selectionCount">已选择 0 条</div>
        <div class="selection-actions">
          <button id="selectAllBtn">全选</button>
          <button id="clearSelectionBtn">取消全选</button>
          <button id="copySelectedBtn">复制已选</button>
          <button id="copySelectedTsvBtn">复制已选表格</button>
          <button id="csvSelectedBtn">下载已选 CSV</button>
        </div>
      </div>

      <div class="result-list" id="resultList">
        <div class="empty">还没有结果。先在左侧填写表单，然后调用 DeepSeek 或生成提示词。</div>
      </div>
    </main>
  </div>

  <script>
    const styles = ["干货型", "情绪型", "反常识型", "热点型", "故事型", "小红书型", "克制专业型"];
    const defaultCategories = ["AI工具", "公众号日更", "小红书转公众号", "副业", "职场", "热点", "产品思考"];
    const storageKeys = {
      categories: "wechat-title-tool-categories",
      larkConfig: "wechat-title-tool-lark-config"
    };
    const state = { mode: "idea", results: [], categories: [...defaultCategories] };

    const $ = (id) => document.getElementById(id);

    function initStyles() {
      const box = $("styleChips");
      styles.forEach((name, index) => {
        const label = document.createElement("label");
        label.className = "chip";
        label.innerHTML = `<input type="checkbox" value="${name}" ${index < 5 ? "checked" : ""}> ${name}`;
        box.appendChild(label);
      });
    }

    function loadSettings() {
      try {
        const savedCategories = JSON.parse(localStorage.getItem(storageKeys.categories) || "null");
        if (Array.isArray(savedCategories) && savedCategories.length) {
          state.categories = savedCategories.map(String).filter(Boolean);
        }
      } catch (error) {
        state.categories = [...defaultCategories];
      }

      try {
        const config = JSON.parse(localStorage.getItem(storageKeys.larkConfig) || "{}");
        $("baseUrl").value = config.baseUrl || "";
        $("baseTableName").value = config.tableName || "公众号选题库";
        $("defaultStatus").value = config.defaultStatus || "待筛选";
      } catch (error) {
        $("baseTableName").value = "公众号选题库";
        $("defaultStatus").value = "待筛选";
      }

      renderCategories();
    }

    function saveCategories() {
      localStorage.setItem(storageKeys.categories, JSON.stringify(state.categories));
    }

    function renderCategories() {
      const box = $("categoryChips");
      box.innerHTML = "";
      state.categories.forEach(category => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = `${escapeHtml(category)} <button type="button" data-delete-category="${escapeHtml(category)}" title="删除分类">×</button>`;
        box.appendChild(chip);
      });
      renderResults();
    }

    function addCategory() {
      const value = $("newCategory").value.trim();
      if (!value) return setStatus("请输入分类名称。", true);
      if (state.categories.includes(value)) return setStatus("这个分类已经存在。", true);
      state.categories.push(value);
      $("newCategory").value = "";
      saveCategories();
      renderCategories();
      setStatus("分类已添加。");
    }

    function deleteCategory(category) {
      if (state.categories.length <= 1) {
        return setStatus("至少保留一个分类。", true);
      }
      state.categories = state.categories.filter(item => item !== category);
      state.results.forEach(item => {
        if (item.category === category) item.category = state.categories[0] || "";
      });
      saveCategories();
      renderCategories();
      setStatus("分类已删除。");
    }

    function resetCategories() {
      state.categories = [...defaultCategories];
      saveCategories();
      renderCategories();
      setStatus("分类已重置。");
    }

    function saveLarkConfig() {
      const config = getLarkConfig();
      localStorage.setItem(storageKeys.larkConfig, JSON.stringify(config));
      setStatus("飞书配置已保存。");
    }

    function getLarkConfig() {
      return {
        baseUrl: $("baseUrl").value.trim(),
        tableName: $("baseTableName").value.trim() || "公众号选题库",
        defaultStatus: $("defaultStatus").value.trim() || "待筛选"
      };
    }

    function getForm() {
      return {
        mode: state.mode,
        apiKey: $("apiKey").value.trim(),
        model: $("model").value,
        count: Number($("count").value),
        fuzzyIdea: $("fuzzyIdea").value.trim(),
        ideaPlatform: $("ideaPlatform").value,
        ideaCount: Number($("ideaCount").value),
        ideaDirection: $("ideaDirection").value.trim(),
        ideaAvoid: $("ideaAvoid").value.trim(),
        topic: $("topic").value.trim(),
        audience: $("audience").value.trim(),
        positioning: $("positioning").value.trim(),
        point: $("point").value.trim(),
        material: $("material").value.trim(),
        extra: $("extra").value.trim(),
        styles: Array.from(document.querySelectorAll("#styleChips input:checked")).map(i => i.value),
        categories: state.categories
      };
    }

    function setStatus(text, isError = false) {
      $("status").innerHTML = isError ? `<strong>${escapeHtml(text)}</strong>` : escapeHtml(text);
    }

    function validateForm(form) {
      if (form.mode === "idea") {
        if (!form.fuzzyIdea && !form.ideaDirection) {
          throw new Error("至少填写一个模糊想法，或者填写账号方向。");
        }
        return;
      }

      if (!form.topic && !form.material && !form.point) {
        throw new Error("精修标题模式下，至少填写文章主题、核心观点或参考素材中的一项。");
      }
      if (!form.styles.length) {
        throw new Error("至少选择一种标题风格。");
      }
    }

    function buildPrompt(form) {
      if (form.mode === "idea") return buildIdeaPrompt(form);
      return `你是一个熟悉公众号、小红书内容转化和中文标题写作的选题编辑。请根据下面信息，生成 ${form.count} 组公众号标题与一句话简介候选。

要求：
1. 标题适合微信公众号推送，不要空泛，不要机械套模板。
2. 一句话简介用于公众号摘要，控制在 20-45 个中文字符，能补充标题但不重复标题。
3. 覆盖这些标题风格：${form.styles.join("、")}。
4. 结果必须返回 JSON 数组，不要 Markdown，不要解释。
5. 每个对象必须包含这些字段：category、title、summary、type、score、reason。
6. score 用 1-5 的数字，5 表示最推荐。
7. reason 用一句短话说明推荐理由。
8. category 必须从这个分类库中选择一个：${form.categories.join("、")}。如果都不合适，选择最接近的分类。

输入信息：
文章主题：${form.topic || "未填写"}
目标读者：${form.audience || "未填写"}
账号定位/人设：${form.positioning || "未填写"}
核心观点：${form.point || "未填写"}
参考素材/小红书内容：${form.material || "未填写"}
额外要求：${form.extra || "未填写"}`;
    }

    function buildIdeaPrompt(form) {
      return `你是一个熟悉公众号选题、小红书兴趣点转化和中文内容策划的选题编辑。用户现在只有一个模糊灵感，还没有想清楚目标读者和核心观点。请帮他把模糊想法发散成 ${form.ideaCount} 个可写的公众号选题。

要求：
1. 每个选题都要能独立写成一篇公众号文章，不要只是关键词。
2. 推荐标题要适合微信公众号推送，克制但有点击欲。
3. 一句话简介用于公众号摘要，控制在 20-45 个中文字符。
4. 目标读者要具体，切入角度要能指导下一步写作。
5. 结果必须返回 JSON 数组，不要 Markdown，不要解释。
6. 每个对象必须包含这些字段：category、topic、title、summary、audience、angle、score、reason。
7. score 用 1-5 的数字，5 表示最推荐。
8. reason 用一句短话说明为什么这个选题值得写。
9. category 必须从这个分类库中选择一个：${form.categories.join("、")}。如果都不合适，选择最接近的分类。

输入信息：
模糊想法/一句话灵感：${form.fuzzyIdea || "未填写"}
偏向平台：${form.ideaPlatform}
账号方向/可选背景：${form.ideaDirection || "未填写"}
不想写什么：${form.ideaAvoid || "未填写"}`;
    }

    async function callDeepSeek() {
      const form = getForm();
      try {
        validateForm(form);
        if (!form.apiKey) {
          showPrompt();
          setStatus("未填写 API Key，已生成可复制提示词。");
          return;
        }

        const prompt = buildPrompt(form);
        $("promptText").value = prompt;
        $("promptBox").style.display = "block";
        $("generateBtn").disabled = true;
        setStatus("正在调用 DeepSeek...");

        const response = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${form.apiKey}`
          },
          body: JSON.stringify({
            model: form.model,
            messages: [
              { role: "system", content: "你只输出可解析 JSON，不输出 Markdown。你擅长中文公众号标题和摘要写作。" },
              { role: "user", content: prompt }
            ],
            temperature: 0.85
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`DeepSeek 返回错误：${response.status} ${errText.slice(0, 160)}`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || "";
        state.results = parseResults(content);
        renderResults();
        setStatus(`已生成 ${state.results.length} 条候选。`);
      } catch (error) {
        showPrompt();
        setStatus(`${error.message} 已保留提示词，可复制到 AI 对话里使用。`, true);
      } finally {
        $("generateBtn").disabled = false;
      }
    }

    function parseResults(content) {
      const cleaned = content
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/```$/i, "")
        .trim();
      const start = cleaned.indexOf("[");
      const end = cleaned.lastIndexOf("]");
      const jsonText = start >= 0 && end >= start ? cleaned.slice(start, end + 1) : cleaned;
      const parsed = JSON.parse(jsonText);
      if (!Array.isArray(parsed)) throw new Error("模型返回的不是数组 JSON。");
      return parsed.map((item, index) => ({
        mode: state.mode,
        category: normalizeCategory(item.category),
        topic: String(item.topic || "").trim(),
        title: String(item.title || "").trim(),
        summary: String(item.summary || item.description || "").trim(),
        audience: String(item.audience || "").trim(),
        angle: String(item.angle || "").trim(),
        type: String(item.type || "未分类").trim(),
        score: Number(item.score || 3),
        reason: String(item.reason || "").trim(),
        id: index + 1,
        selected: false
      })).filter(item => item.title || item.topic);
    }

    function normalizeCategory(category) {
      const text = String(category || "").trim();
      if (state.categories.includes(text)) return text;
      return state.categories[0] || "未分类";
    }

    function showPrompt() {
      const form = getForm();
      try {
        validateForm(form);
        $("promptText").value = buildPrompt(form);
        $("promptBox").style.display = "block";
        setStatus("提示词已生成。");
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function renderResults() {
      const list = $("resultList");
      list.innerHTML = "";
      if (!state.results.length) {
        list.innerHTML = `<div class="empty">还没有结果。先在左侧填写表单，然后调用 DeepSeek 或生成提示词。</div>`;
        updateSelectionBar();
        return;
      }

      state.results
        .slice()
        .sort((a, b) => b.score - a.score)
        .forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "card";
          card.classList.toggle("selected", Boolean(item.selected));
          card.innerHTML = state.mode === "idea" ? ideaCardHtml(item, index) : titleCardHtml(item, index);
          list.appendChild(card);
        });
      updateSelectionBar();
    }

    function ideaCardHtml(item, index) {
      return `
            <div class="card-head">
              <div class="tag-row">
                <label class="select-wrap">
                  <input type="checkbox" data-select="${item.id}" ${item.selected ? "checked" : ""}>
                  选择
                </label>
                <span class="tag">选题</span>
                ${index < 3 ? `<span class="tag">推荐</span>` : ""}
              </div>
              <div class="score">${"★".repeat(Math.max(1, Math.min(5, item.score)))}</div>
            </div>
            <h2 class="title">${escapeHtml(item.topic || item.title)}</h2>
            ${categorySelectHtml(item)}
            <p class="desc">${escapeHtml(item.title)}</p>
            <p class="reason">${escapeHtml(item.summary)}</p>
            <div class="meta">
              <div><strong>目标读者：</strong>${escapeHtml(item.audience || "未填写")}</div>
              <div><strong>切入角度：</strong>${escapeHtml(item.angle || "未填写")}</div>
              <div><strong>推荐理由：</strong>${escapeHtml(item.reason || "未填写")}</div>
            </div>
            <div class="card-foot">
              <button data-copy="${item.id}">复制单条</button>
            </div>
          `;
    }

    function titleCardHtml(item, index) {
      return `
            <div class="card-head">
              <div class="tag-row">
                <label class="select-wrap">
                  <input type="checkbox" data-select="${item.id}" ${item.selected ? "checked" : ""}>
                  选择
                </label>
                <span class="tag">${escapeHtml(item.type)}</span>
                ${index < 3 ? `<span class="tag">推荐</span>` : ""}
              </div>
              <div class="score">${"★".repeat(Math.max(1, Math.min(5, item.score)))}</div>
            </div>
            <h2 class="title">${escapeHtml(item.title)}</h2>
            ${categorySelectHtml(item)}
            <p class="desc">${escapeHtml(item.summary)}</p>
            <p class="reason">${escapeHtml(item.reason)}</p>
            <div class="card-foot">
              <button data-copy="${item.id}">复制单条</button>
            </div>
          `;
    }

    function categorySelectHtml(item) {
      const options = state.categories.map(category => {
        const selected = category === item.category ? "selected" : "";
        return `<option value="${escapeHtml(category)}" ${selected}>${escapeHtml(category)}</option>`;
      }).join("");
      return `
            <div class="category-edit">
              <label for="category-${item.id}">分类</label>
              <select id="category-${item.id}" data-category="${item.id}">
                ${options}
              </select>
            </div>
          `;
    }

    function getSelectedResults() {
      return state.results.filter(item => item.selected);
    }

    function getExportItems(onlySelected = false) {
      return onlySelected ? getSelectedResults() : state.results;
    }

    function toRows(items = state.results) {
      if (state.mode === "idea") {
        return items.map(item => [
          item.category,
          item.topic,
          item.title,
          item.summary,
          item.audience,
          item.angle,
          item.score,
          item.reason
        ]);
      }

      return items.map(item => [
        item.category,
        item.title,
        item.summary,
        item.type,
        item.score,
        item.reason
      ]);
    }

    function toTsv(items = state.results) {
      const header = state.mode === "idea"
        ? ["分类", "选题", "推荐标题", "一句话简介", "目标读者", "切入角度", "推荐指数", "推荐理由"]
        : ["分类", "标题", "一句话简介", "标题类型", "推荐指数", "推荐理由"];
      const rows = [header, ...toRows(items)];
      return rows.map(row => row.map(cell => String(cell).replace(/\t/g, " ").replace(/\n/g, " ")).join("\t")).join("\n");
    }

    function toCsv(items = state.results) {
      const header = state.mode === "idea"
        ? ["分类", "选题", "推荐标题", "一句话简介", "目标读者", "切入角度", "推荐指数", "推荐理由"]
        : ["分类", "标题", "一句话简介", "标题类型", "推荐指数", "推荐理由"];
      const rows = [header, ...toRows(items)];
      return "\ufeff" + rows.map(row => row.map(csvCell).join(",")).join("\r\n");
    }

    function toSyncCsv(items = getSelectedResults()) {
      const config = getLarkConfig();
      const batch = makeBatchId();
      const rows = [
        ["分类", "选题", "标题", "一句话简介", "目标读者", "切入角度", "标题类型", "推荐指数", "推荐理由", "来源模式", "状态", "同步批次", "创建时间"],
        ...items.map(item => [
          item.category,
          state.mode === "idea" ? item.topic : "",
          item.title,
          item.summary,
          state.mode === "idea" ? item.audience : "",
          state.mode === "idea" ? item.angle : "",
          state.mode === "title" ? item.type : "",
          item.score,
          item.reason,
          state.mode === "idea" ? "灵感发散" : "精修标题",
          config.defaultStatus,
          batch,
          new Date().toLocaleString("zh-CN")
        ])
      ];
      return "\ufeff" + rows.map(row => row.map(csvCell).join(",")).join("\r\n");
    }

    function makeBatchId() {
      const now = new Date();
      const pad = value => String(value).padStart(2, "0");
      return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replace(/"/g, '""')}"`;
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          fallbackCopy(text);
        }
        setStatus("已复制。");
      } catch (error) {
        fallbackCopy(text);
        setStatus("已复制。");
      }
    }

    function fallbackCopy(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
    }

    function downloadCsv(onlySelected = false) {
      const items = getExportItems(onlySelected);
      if (!items.length) {
        setStatus("没有可导出的结果。", true);
        return;
      }
      const blob = new Blob([toCsv(items)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      a.href = url;
      const scope = onlySelected ? "已选" : "全部";
      a.download = `${state.mode === "idea" ? "公众号选题发散" : "公众号标题候选"}-${scope}-${date}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      setStatus("CSV 已下载。");
    }

    function downloadSyncCsv() {
      const items = getSelectedResults();
      if (!items.length) return setStatus("还没有勾选内容。", true);
      const config = getLarkConfig();
      if (!config.baseUrl) return setStatus("请先填写飞书 Base 链接。", true);
      saveLarkConfig();
      const blob = new Blob([toSyncCsv(items)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `飞书同步-公众号选题库-${makeBatchId()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      setStatus(`已下载 ${items.length} 条已选内容的飞书同步 CSV。`);
    }

    function clearAll() {
      ["fuzzyIdea", "ideaDirection", "ideaAvoid", "topic", "audience", "positioning", "point", "material", "extra"].forEach(id => $(id).value = "");
      state.results = [];
      $("promptText").value = "";
      $("promptBox").style.display = "none";
      renderResults();
      setStatus("已清空输入和结果。");
    }

    function fillSample() {
      if (state.mode === "idea") {
        $("fuzzyIdea").value = "AI 工具太多，普通人反而不知道从哪里开始；小红书上很多人收藏了一堆教程但真正用起来很少。";
        $("ideaDirection").value = "AI 自媒体、普通人效率工具、公众号日更";
        $("ideaAvoid").value = "不要卖课口吻，不要制造焦虑，不要太空泛。";
      } else {
        $("topic").value = "普通人如何用 AI 做公众号日更";
        $("audience").value = "想做自媒体但不知道怎么开始的职场人";
        $("positioning").value = "实战、克制、讲人话，强调可落地";
        $("point").value = "日更不是靠灵感，而是靠稳定的选题、标题、素材和发布流程。AI 最适合帮人把流程标准化。";
        $("material").value = "小红书上大家常见痛点：不会起标题、写一半放弃、收藏很多工具但用不起来、怕内容太像 AI、想要低成本开始。";
        $("extra").value = "标题不要太夸张，不要使用割韭菜口吻，适合公众号推送。";
      }
      setStatus("示例已填入。");
    }

    function setMode(mode) {
      state.mode = mode;
      state.results = [];
      document.querySelectorAll(".mode-tab").forEach(button => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });
      $("ideaPanel").classList.toggle("active", mode === "idea");
      $("titlePanel").classList.toggle("active", mode === "title");
      $("resultSub").textContent = mode === "idea"
        ? "灵感模式字段：分类、选题、推荐标题、简介、目标读者、切入角度、推荐指数、理由。"
        : "精修模式字段：分类、标题、简介、类型、推荐指数、理由。";
      $("promptText").value = "";
      $("promptBox").style.display = "none";
      renderResults();
      setStatus(mode === "idea" ? "已切换到灵感发散模式。" : "已切换到精修标题模式。");
    }

    function formatItemText(item) {
      return state.mode === "idea"
        ? `分类：${item.category}\n选题：${item.topic}\n推荐标题：${item.title}\n简介：${item.summary}\n目标读者：${item.audience}\n切入角度：${item.angle}\n推荐指数：${item.score}\n理由：${item.reason}`
        : `分类：${item.category}\n标题：${item.title}\n简介：${item.summary}\n类型：${item.type}\n推荐指数：${item.score}\n理由：${item.reason}`;
    }

    function updateSelectionBar() {
      const total = state.results.length;
      const selected = getSelectedResults().length;
      $("selectionBar").classList.toggle("active", total > 0);
      $("selectionCount").textContent = `已选择 ${selected} 条 / 共 ${total} 条`;
    }

    function setAllSelected(selected) {
      state.results.forEach(item => item.selected = selected);
      renderResults();
      setStatus(selected ? "已全选。" : "已取消全选。");
    }

    function copySelected(asTable = false) {
      const items = getSelectedResults();
      if (!items.length) return setStatus("还没有勾选内容。", true);
      copyText(asTable ? toTsv(items) : items.map(formatItemText).join("\n\n"));
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("click", async (event) => {
      const deleteCategoryName = event.target.getAttribute?.("data-delete-category");
      if (deleteCategoryName) {
        deleteCategory(deleteCategoryName);
        return;
      }

      const copyId = event.target.getAttribute?.("data-copy");
      if (!copyId) return;
      const item = state.results.find(x => String(x.id) === String(copyId));
      if (item) {
        await copyText(formatItemText(item));
      }
    });

    document.addEventListener("change", (event) => {
      const categoryId = event.target.getAttribute?.("data-category");
      if (categoryId) {
        const item = state.results.find(x => String(x.id) === String(categoryId));
        if (!item) return;
        item.category = event.target.value;
        renderResults();
        return;
      }

      const selectId = event.target.getAttribute?.("data-select");
      if (!selectId) return;
      const item = state.results.find(x => String(x.id) === String(selectId));
      if (!item) return;
      item.selected = event.target.checked;
      renderResults();
    });

    document.querySelectorAll(".mode-tab").forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });
    $("generateBtn").addEventListener("click", callDeepSeek);
    $("promptBtn").addEventListener("click", showPrompt);
    $("sampleBtn").addEventListener("click", fillSample);
    $("clearBtn").addEventListener("click", clearAll);
    $("addCategoryBtn").addEventListener("click", addCategory);
    $("newCategory").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addCategory();
      }
    });
    $("resetCategoriesBtn").addEventListener("click", resetCategories);
    $("saveLarkConfigBtn").addEventListener("click", saveLarkConfig);
    $("syncCsvBtn").addEventListener("click", downloadSyncCsv);
    $("copyPromptBtn").addEventListener("click", () => copyText($("promptText").value));
    $("copyAllBtn").addEventListener("click", () => {
      if (!state.results.length) return setStatus("没有可复制的结果。", true);
      copyText(state.results.map(formatItemText).join("\n\n"));
    });
    $("copyTsvBtn").addEventListener("click", () => {
      if (!state.results.length) return setStatus("没有可复制的结果。", true);
      copyText(toTsv(state.results));
    });
    $("csvBtn").addEventListener("click", () => downloadCsv(false));
    $("selectAllBtn").addEventListener("click", () => setAllSelected(true));
    $("clearSelectionBtn").addEventListener("click", () => setAllSelected(false));
    $("copySelectedBtn").addEventListener("click", () => copySelected(false));
    $("copySelectedTsvBtn").addEventListener("click", () => copySelected(true));
    $("csvSelectedBtn").addEventListener("click", () => downloadCsv(true));

    initStyles();
    loadSettings();
    renderResults();
  </script>
</body>
</html>
